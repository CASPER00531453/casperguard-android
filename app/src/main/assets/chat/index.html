<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BurakAI</title>
<style>
:root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#f1f5f9; --muted:#94a3b8; --accent:#22d3ee; --danger:#fca5a5; --on-accent:#082f49; }
:root[data-edition="viltrum"] { --bg:#000; --panel:#161616; --line:#3a3a3a; --text:#fff; --muted:#a8a8a8; --accent:#c8102e; --danger:#ff9a9a; --on-accent:#fff; }
.logo.emblem { width:120px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body, #root { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
main { display:flex; flex-direction:column; height:100%; }
.log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.welcome { display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:12px 0; }
.logo { width:min(240px, 70%); height:auto; margin-bottom:12px; }
h1 { font-size:20px; margin:8px 0 0; }
.welcome p { margin:0; color:var(--muted); }
.row { display:flex; align-items:flex-start; gap:8px; max-width:100%; }
.avatar { flex:none; width:32px; height:32px; }
.bubble { padding:10px 12px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:85%; }
.bubble.user { align-self:flex-end; background:var(--accent); color:var(--on-accent); }
.bubble.ai { background:var(--panel); }
.bubble.error { color:var(--danger); }
.thinking { padding-top:5px; color:var(--muted); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chips button { min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--text); font:inherit; }
.card { display:flex; flex-direction:column; gap:10px; padding:14px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
.card-title { font-weight:600; }
.stars { display:flex; gap:4px; }
.star { width:44px; height:44px; padding:8px; border:0; background:transparent; }
.star svg { width:100%; height:100%; fill:none; stroke:var(--muted); stroke-width:1.5; }
.star.on svg { fill:var(--accent); stroke:var(--accent); }
textarea, input { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); font:inherit; padding:10px 12px; }
textarea { min-height:72px; resize:none; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.primary { min-height:44px; padding:8px 14px; border:0; border-radius:12px; background:var(--accent); color:var(--on-accent); font:inherit; font-weight:600; }
.primary:disabled { opacity:.45; }
.hint { color:var(--muted); font-size:14px; }
.center { text-align:center; }
form { display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
