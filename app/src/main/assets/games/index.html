<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyunlar</title>
<style>
:root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#f1f5f9; --muted:#94a3b8; --accent:#22d3ee; --on-accent:#082f49; --hot:#f87171; }
:root[data-edition="viltrum"] { --bg:#000; --panel:#161616; --line:#3a3a3a; --text:#fff; --muted:#a8a8a8; --accent:#c8102e; --on-accent:#fff; --hot:#ff6b6b; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body, #root { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
main { display:flex; flex-direction:column; height:100%; }
.screen { flex:1; overflow-y:auto; padding:16px; }
h1 { font-size:20px; margin:0; }
h2 { font-size:16px; margin:0; }
p { margin:0; }
.stack { display:flex; flex-direction:column; gap:12px; }
.row { display:flex; align-items:center; gap:8px; }
.grow { flex:1; min-width:0; }
.center { text-align:center; align-items:center; justify-content:center; }
.hint { color:var(--muted); font-size:14px; }
.card { display:flex; flex-direction:column; gap:10px; padding:14px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
input { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); font:inherit; padding:10px 12px; min-height:44px; }
button { min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--text); font:inherit; }
button.primary { border:0; background:var(--accent); color:var(--on-accent); font-weight:600; }
button.small { padding:8px 12px; }
button.link { border:0; padding:0 4px; min-height:0; color:var(--accent); background:none; }
button:disabled { opacity:.4; }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.me { display:flex; align-items:center; gap:8px; }
.avatars { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.avatar { display:flex; justify-content:center; padding:10px; }
.avatar.on { border-color:var(--accent); background:var(--panel); }
.invite { padding:10px; border:1px solid var(--line); border-radius:12px; }
.players { display:flex; flex-direction:column; gap:6px; }
.player { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:var(--panel); font-size:14px; }
.player.you { outline:1px solid var(--accent); }
.player.dropped { opacity:.45; }
.slots { min-width:32px; text-align:right; color:var(--muted); }
.big-card { margin:8px auto 0; width:min(260px, 80%); min-height:150px; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; border-radius:16px; background:var(--panel); border:2px solid var(--accent); font-size:24px; font-weight:700; overflow-wrap:anywhere; }
.flip { animation:flip .5s ease-out; }
@keyframes flip { from { transform:rotateY(90deg); opacity:0; } to { transform:rotateY(0); opacity:1; } }
.countdown { align-self:center; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; border:2px solid var(--line); }
.countdown.hot { border-color:var(--hot); color:var(--hot); }
.bid { font-size:18px; }
.deck { position:relative; width:120px; height:80px; }
.mini-card { position:absolute; inset:0; border-radius:10px; border:2px solid var(--accent); background:var(--panel); animation:shuffle 1s ease-in-out infinite alternate; }
@keyframes shuffle { from { transform:translateX(-30px) rotate(-8deg); } to { transform:translateX(30px) rotate(8deg); } }
.team { display:flex; flex-direction:column; gap:6px; text-align:left; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:4px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--line); font-size:13px; }
.vote { padding:12px; background:var(--panel); }
.toast { position:fixed; left:16px; right:16px; bottom:56px; padding:10px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--hot); text-align:center; }
.banner { padding:8px 12px; margin-bottom:12px; border-radius:10px; background:var(--panel); color:var(--hot); text-align:center; font-size:14px; }
.footer { display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); color:var(--muted); font-size:13px; letter-spacing:.08em; }
@media (prefers-reduced-motion: reduce) { .flip, .mini-card { animation:none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
