name: CasperGuard APK derle

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynagi al (submodullerle)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: NDK ve CMake kur
        run: |
          SDKMGR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: gradlew calistirilabilir yap
        run: chmod +x ./gradlew

      - name: Imza anahtari olustur
        run: |
          keytool -genkeypair -v -keystore cg.keystore -alias cg \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass casperguard -keypass casperguard \
            -dname "CN=CasperGuard, O=CasperGuard, C=TR"

      - name: Release APK derle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK imzala
        run: |
          mkdir -p out
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
            --ks cg.keystore --ks-key-alias cg \
            --ks-pass pass:casperguard --key-pass pass:casperguard \
            --out out/CasperGuard.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify out/CasperGuard.apk

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: CasperGuard-apk
          path: out/CasperGuard.apk

      - name: Release'e bas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: CasperGuard (test)
          body: |
            CasperGuard test APK'si (imzali release). Telefona kur, Start'a bas, Instagram/Discord ac.
            Strateji ve DNS gomulu geldi; ayar yapmana gerek yok.
            Not: onceki CasperGuard kuruluysa once onu kaldir.
          files: out/CasperGuard.apk
